[project]
name = "dashboard-wj-cs-mcp"
version = "0.1.0"
description = "MCP Server for WJ dashboard CS agent"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "mysql-connector-python>=9.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
serve = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
